spec:
  gcp:
    sqlInstances:
      - type: POSTGRES_18
        diskAutoresize: true
        tier: db-f1-micro
        name: sp-sykepengegrunnlag
        databases:
          - name: sp-sykepengegrunnlag
            envVarPrefix: DATABASE
            users:
              - name: sp-sykepengegrunnlag-opprydding-dev
        flags:
          - name: cloudsql.enable_pgaudit
            value: "off"
          - name: pgaudit.log
            value: "write,ddl,role"
          - name: pgaudit.log_parameter
            value: "on"
          - name: pgaudit.log_relation
            value: "on"
  kafka:
    pool: nav-dev
  azure:
    application:
      claims:
        groups:
          - id: 216b7219-3906-43c5-8e22-03fb74133b42 # 0000-CA-Speil_Lesetilgang
          - id: cda797bb-ac3b-4440-b661-2cd5eb3edba0 # 0000-CA-Speil-Saksbehandler
  env:
    - name: TILGANGSMASKINEN_SCOPE
      value: "api://dev-gcp.tilgangsmaskin.populasjonstilgangskontroll/.default"
    - name: TILGANG_LES
      value: 216b7219-3906-43c5-8e22-03fb74133b42,cda797bb-ac3b-4440-b661-2cd5eb3edba0
    - name: SP_RETTIGHETSKATEGORI_SCOPE
      value: "api://dev-gcp.tbd.sp-rettighetskategori/.default"
    - name: SPEDISJON_SCOPE
      value: "api://dev-gcp.tbd.spedisjon/.default"
    - name: INNTEKTSKOMPONENTEN_BASE_URL
      value: https://ikomp-q2.dev-fss-pub.nais.io/rs
    - name: INNTEKTSKOMPONENTEN_SCOPE
      value: "api://dev-fss.team-inntekt.ikomp-q2/.default"
  accessPolicy:
    outbound:
      external:
        - host: ikomp-q2.dev-fss-pub.nais.io
