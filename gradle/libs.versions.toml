[versions]
flyway = "13.12.2"
tbd-libs = "20261029.1843"
sykepengerGradlePlugins = "20261029.1945"
sykepenger-libs-kafka-test = "20261116.0849"
sykepenger-libs-logging = "20261116.0849"
sykepenger-libs-postgres = "20261116.0849"
sykepenger-libs-testing = "20261116.0849"

[libraries]
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
hikaricp = "com.zaxxer:HikariCP:7.1.0"
cloud-sql-postgres-socket-factory = "com.google.cloud.sql:postgres-socket-factory:1.31.0"
kotliquery = "com.github.seratch:kotliquery:1.9.1"
postgresql = "org.postgresql:postgresql:42.7.14"
rapids-and-rivers = "com.github.navikt:rapids-and-rivers:2026110308421793691732"
sykepengerLibs-logging = { module = "no.nav.sykepenger.libs:logging", version.ref = "sykepenger-libs-logging" }
sykepengerLibs-kafka-test = { module = "no.nav.sykepenger.libs:kafka-test", version.ref = "sykepenger-libs-kafka-test" }
sykepengerLibs-postgres = { module = "no.nav.sykepenger.libs:postgres", version.ref = "sykepenger-libs-postgres" }
sykepengerLibs-testing = { module = "no.nav.sykepenger.libs:testing", version.ref = "sykepenger-libs-testing" }

tbd-libs-azure-token-client-default = { module = "com.github.navikt.tbd-libs:azure-token-client-default", version.ref = "tbd-libs" }
tbd-libs-mock-http-client = { module = "com.github.navikt.tbd-libs:mock-http-client", version.ref = "tbd-libs" }
tbd-libs-rapids-and-rivers-test = { module = "com.github.navikt.tbd-libs:rapids-and-rivers-test", version.ref = "tbd-libs" }
tbd-libs-spedisjon-client = { module = "com.github.navikt.tbd-libs:spedisjon-client", version.ref = "tbd-libs" }

[plugins]
sykepenger-deployable = { id = "no.nav.sykepenger.deployable", version.ref = "sykepengerGradlePlugins" }
sykepenger-kotlin = { id = "no.nav.sykepenger.kotlin", version.ref = "sykepengerGradlePlugins" }
sykepenger-root = { id = "no.nav.sykepenger.root", version.ref = "sykepengerGradlePlugins" }
